appId: dev.orc.app
productName: Orc
directories:
  output: dist
files:
  - out/**
  - package.json
# The SDK ships its own Claude Code binary; it must stay a real file on disk (not inside app.asar) to be spawned.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  # Signing/notarization: set CSC_NAME (or CSC_LINK/CSC_KEY_PASSWORD) and APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID.
  # The unpacked SDK binary is signed along with the bundle.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDir: true
