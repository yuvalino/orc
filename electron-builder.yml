appId: dev.orc.app
productName: Orc
# Orc Offline (electron-builder.offline.yml) is the same app under its own file names.
artifactName: Orc-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - '!out/server/**' # orc-server bundles and their build cache: the offline edition carries the bundles as resources
  - package.json
# The SDK ships its own Claude Code binary; it must stay a real file on disk (not inside app.asar) to be spawned.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  # Signing/notarization: set CSC_NAME (or CSC_LINK/CSC_KEY_PASSWORD) and APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID.
  # The unpacked SDK binary is signed along with the bundle.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: [nsis]
nsis:
  artifactName: Orc-${version}-${os}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Development
