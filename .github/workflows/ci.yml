name: CI
# Every pull request: typecheck, build, and the Playwright suite (Electron against the fake SDK) under a virtual display.
# Run it by hand (workflow_dispatch) to check a branch without a PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Electron's sandbox on a CI runner: Ubuntu 24.04 restricts the unprivileged user namespaces it uses, and its setuid
      # helper must be root-owned.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results
            tests/screenshots
