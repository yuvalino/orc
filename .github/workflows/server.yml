name: orc-server bundles
# Builds the self-contained orc-server bundle for every target on a macOS runner (codesign for the darwin ones),
# smoke-tests each on its own platform, and attaches them with bundles.json to the release the app points at.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-server.mjs darwin-arm64 darwin-x64 linux-x64 linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            out/server/orc-server-*.tar.gz
            bundles.json

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-13, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: bundles, path: out/server }
      - run: mkdir -p out/server/${{ matrix.target }} && tar xzf out/server/orc-server-${{ matrix.target }}.tar.gz -C out/server/${{ matrix.target }}
      - run: node scripts/check-server.mjs out/server/${{ matrix.target }}/orc-server

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: bundles, path: bundles }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/out/server/orc-server-*.tar.gz
            bundles/bundles.json
