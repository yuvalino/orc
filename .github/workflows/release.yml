name: Release
# A v* tag publishes a release:
#   1. server: the orc-server bundle for each target, one job each (darwin on macOS for codesigning, the rest on Linux,
#      which cross-builds them), each with its manifest entry (url + sha256);
#   2. smoke: each bundle runs on its own platform, alongside the app builds;
#   3. app: Orc for Windows, Linux and macOS in two editions, compiled with the merged bundles.json (the app checks a
#      host's install against it): regular, whose hosts download their bundle from this release, and Orc Offline, which
#      carries every bundle and sends it over ssh;
#   4. release: one GitHub release with both editions' installers, the bundles and bundles.json, plus regular Orc's
#      update files (latest*.yml, .blockmap, the macOS .zip it updates from; betas get latest*.yml too, which electron-updater
#      falls back to after looking for beta*.yml).
# A beta tag (vX.Y.Z-beta.N) publishes a prerelease of regular Orc only: Orc Offline has no updater and no betas.
# Tagged builds take their version from the tag. Run by hand (workflow_dispatch) it's a dry run: everything but the release.
# Speed: node_modules, Electron's downloads and build-server's cache are cached per runner; npm ci only runs on a miss.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  server:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-latest, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
          - { os: ubuntu-latest, target: win32-x64 }
          - { os: ubuntu-latest, target: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: deps
        uses: actions/cache@v4
        with: { path: node_modules, key: "modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}" }
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}" # the tag decides the version
        shell: bash
      - uses: actions/cache@v4
        with: { path: out/server/cache, key: "server-${{ matrix.target }}-${{ hashFiles('package-lock.json', 'scripts/build-server.mjs') }}" }
      - id: signing
        if: runner.os == 'macOS' # notarizing Orc Offline, which carries these, needs them Developer ID–signed
        uses: ./.github/actions/mac-signing
        with: { certificate: '${{ secrets.CSC_LINK }}', password: '${{ secrets.CSC_KEY_PASSWORD }}' }
      - run: npm run build
      - run: node scripts/build-server.mjs ${{ matrix.target }}
        env: { ORC_SIGN_IDENTITY: '${{ steps.signing.outputs.identity }}' }
      # This target's manifest entry; the app and release jobs merge them into bundles.json.
      - run: node -e "const t='${{ matrix.target }}';require('fs').writeFileSync('manifest-'+t+'.json',JSON.stringify({[t]:require('./bundles.json').bundles[t]}))"
      - uses: actions/upload-artifact@v4
        with: { name: 'bundle-${{ matrix.target }}', path: 'out/server/orc-server-${{ matrix.target }}.tar.gz', compression-level: 0, if-no-files-found: error } # gzipped already
      - uses: actions/upload-artifact@v4
        with: { name: 'manifest-${{ matrix.target }}', path: 'manifest-${{ matrix.target }}.json', if-no-files-found: error }

  smoke:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # check-server needs only Node's own modules and the fixtures: no npm ci
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: 'bundle-${{ matrix.target }}', path: out/server }
      - run: mkdir -p out/server/${{ matrix.target }} && tar xzf out/server/orc-server-${{ matrix.target }}.tar.gz -C out/server/${{ matrix.target }}
        shell: bash
      - run: node scripts/check-server.mjs out/server/${{ matrix.target }}/orc-server${{ startsWith(matrix.target, 'win32') && '.exe' || '' }}
        shell: bash

  app:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        edition: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') && '["regular"]' || '["regular", "offline"]') }} # beta tags: regular Orc only
        include:
          - { os: windows-latest, flags: --win --x64 }
          - { os: ubuntu-latest, flags: --linux --x64 }
          - { os: macos-latest, flags: --mac --arm64 } # Apple silicon; npm ci only fetches the SDK's Claude Code binary for the runner's arch
          - { os: macos-latest, edition: regular, flags: --mac dmg zip --arm64 } # the zip is what the updater installs from
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing and notarization, once the secrets exist (electron-builder signs with CSC_*, notarizes with APPLE_*);
      # without them the build stays unsigned. Windows and Linux aren't signed.
      MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
      MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: deps
        uses: actions/cache@v4
        with: { path: node_modules, key: "modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}" }
      - uses: actions/cache@v4
        with:
          path: .cache
          key: "electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}"
          restore-keys: "electron-${{ runner.os }}-${{ runner.arch }}-"
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}" # the tag decides the version
        shell: bash
      - uses: actions/download-artifact@v4
        with: { pattern: manifest-*, path: manifests, merge-multiple: true }
      - run: node -e "const fs=require('fs'),b={};for(const f of fs.readdirSync('manifests'))Object.assign(b,JSON.parse(fs.readFileSync('manifests/'+f)));fs.writeFileSync('bundles.json',JSON.stringify({version:require('./package.json').version,bundles:b},null,2)+'\n')"
      - if: matrix.edition == 'offline'
        uses: actions/download-artifact@v4
        with: { pattern: bundle-*, path: out/server, merge-multiple: true }
      - if: runner.os == 'macOS' # the Developer ID for electron-builder to find (see the action)
        uses: ./.github/actions/mac-signing
        with: { certificate: '${{ secrets.CSC_LINK }}', password: '${{ secrets.CSC_KEY_PASSWORD }}' }
      - run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then # signs with the identity in our keychain (see above)
            [ -n "$MAC_APPLE_ID" ] && export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ matrix.edition }}" = offline ]; then export ORC_OFFLINE=1; config="--config electron-builder.offline.yml"; fi
          npm run build
          if [ -n "$ORC_OFFLINE" ] && grep -rqE 'quitAndInstall|autoInstallOnAppQuit|releases.atom' out/main out/preload out/renderer; then echo '::error::Orc Offline contains update code'; exit 1; fi # it must have none
          npx electron-builder ${{ matrix.flags }} $config --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.edition }}
          compression-level: 0 # installers are compressed already
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/Orc-*.zip
            dist/Orc-*.blockmap
            dist/latest*.yml
            !dist/Orc-Offline-*.blockmap

  release:
    needs: [smoke, app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: package.json, sparse-checkout-cone-mode: false }
      - run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v4
        with: { pattern: bundle-*, path: bundles, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: manifest-*, path: manifests, merge-multiple: true }
      - run: node -e "const fs=require('fs'),b={};for(const f of fs.readdirSync('manifests'))Object.assign(b,JSON.parse(fs.readFileSync('manifests/'+f)));fs.writeFileSync('bundles/bundles.json',JSON.stringify({version:require('./package.json').version,bundles:b},null,2)+'\n')"
      - uses: actions/download-artifact@v4
        with: { pattern: app-*, path: app, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Orc ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }} # the release job only runs for tags
          generate_release_notes: true
          files: |
            app/*
            bundles/*
